name: DS4 bridge and virtual pad parser
on: [push, pull_request, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B tools/tests/test_virtual_device.py
      - run: python3 -B tools/tests/test_vpad_log_source.py
      - run: python3 -B tools/tests/test_vpad_injection.py
      - run: python3 -B tools/tests/test_usb_input_gate.py
      - run: python3 -B tools/tests/test_gh5_hid.py
      - run: python3 -B tools/tests/test_usb_completion.py
      - run: python3 -B tools/tests/test_usb_fallback.py
      - run: python3 -B tools/tests/test_ds4_bridge.py
