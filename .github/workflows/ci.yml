name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install QR verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Check shell syntax
        run: |
          set -euo pipefail
          find tools -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Verify shipped QR assets
        run: python tools/make-qr-assets.py --verify-only
